name: Portfolio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Validates Amplify's public-origin guard without contacting or deploying AWS.
      AWS_APP_ID: ci-configuration-check
      VITE_SITE_URL: https://main.example.amplifyapp.com
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test, validate and build
        run: npm run verify:ci
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified build for inspection
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-build-example-origin
          path: dist/
          if-no-files-found: error
          retention-days: 7

  production:
    name: Verify AWS Production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      # Report through the API below so production_environment is explicit.
      deployment: false
      url: https://main.d229cwpntq8yz1.amplifyapp.com
    env:
      PRODUCTION_URL: https://main.d229cwpntq8yz1.amplifyapp.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact commit being reported
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reject a superseded commit
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$current" = "$GITHUB_SHA"
      - name: Start an explicitly classified production record
        id: deployment
        shell: bash
        run: |
          payload=$(jq -n --arg ref "$GITHUB_SHA" '{ref: $ref, auto_merge: false, required_contexts: [], environment: "production", production_environment: true}')
          id=$(printf '%s' "$payload" | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress -f environment_url="$PRODUCTION_URL" -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Wait for the matching public AWS build and verify its file hashes
        run: node scripts/verify-production.mjs
      - name: Confirm the verified commit is still current
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$current" = "$GITHUB_SHA"
      - name: Record the actual verification outcome
        if: always() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          VERIFICATION_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          if [ "$VERIFICATION_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" -f state="$state" -f environment_url="$PRODUCTION_URL" -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -F auto_inactive=true
