version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
        - npm test
        - npm run check:assets
        - npm run check:unused
        - npm run check:docs
    build:
      commands:
        - npm run build
        - npm run check:dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
