<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1100" viewBox="0 0 1040 1100" role="img" aria-labelledby="title desc">
<title id="title">Component design and local state</title><desc id="desc">Read top to bottom. Shared records feed pages and terminal answers.</desc>
<metadata id="original-mermaid-source">flowchart TB
  Main[main.jsx] --&gt; App[App.jsx]
  App --&gt; Theme[ThemeProvider]
  Theme --&gt; TerminalProvider[TerminalProvider]
  TerminalProvider --&gt; Router[BrowserRouter and PortfolioRoutes]
  Router --&gt; Layout[Shared Layout]
  Layout --&gt; Nav[Navbar and mobile menu]
  Layout --&gt; Pages[Outlet and Suspense: Home, projects, blog, legal, NotFound]
  Layout --&gt; Footer[Footer]
  Layout --&gt; Terminal[DevTerminal dialog]
  Pages --&gt; Data[Projects, portfolio, blog and contribution records]
  Pages --&gt; SEO[SEO effects and scroll utilities]
  Terminal --&gt; Commands[Command resolver and answer formatter]
  Commands --&gt; Questions[Question matching and project follow-ups]
  Commands --&gt; Data
  Terminal --&gt; History[History reducer]
  Terminal --&gt; Keys[Keyboard action mapping]</metadata>
