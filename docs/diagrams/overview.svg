<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc">
<title id="title">Portfolio architecture at a glance</title><desc id="desc">Source → verified static build → intended hosting → visitor browser</desc>
<metadata id="original-mermaid-source">flowchart LR
  Repo[Source repository] --&gt; Build[Node 22: install, tests, asset checks, Vite]
  Build --&gt; Dist[dist: HTML, JS, CSS, static assets, metadata]
  Dist --&gt;|Owner deployment pending| Hosting[AWS Amplify Hosting]
  Hosting --&gt; Browser[Visitor browser]
  Browser --&gt; UI[React routes and local terminal state]</metadata>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="958" height="838" rx="18" fill="#ffffff" stroke="#d3dce8"/>
<text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#15243c" text-anchor="start">Portfolio architecture at a glance</text>
<text x="40" y="78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#485971" text-anchor="start">Source → verified static build → intended hosting → visitor browser</text>
<path d="M480 216 L480 252" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M480 372 L480 408" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M480 516 L480 552" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M480 660 L480 696" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="source"><rect x="192" y="112" width="576" height="104" rx="12" fill="#f5f8fc" stroke="#bdcbdd" stroke-width="1.5"/>
<text x="212" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#15243c" text-anchor="start">1  Source repository</text>
<text x="212" y="174" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">React source, project data, assets and lockfile</text>
</g>
<g data-node="build"><rect x="192" y="252" width="576" height="120" rx="12" fill="#edf4ff" stroke="#bdcbdd" stroke-width="1.5"/>
<text x="212" y="285" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#15243c" text-anchor="start">2  Node 22 build and checks</text>
<text x="212" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">npm ci → tests → asset checks → Vite</text>
<text x="212" y="339" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">Build metadata and artifact validation</text>
</g>
<g data-node="artifact"><rect x="192" y="408" width="576" height="108" rx="12" fill="#f5f8fc" stroke="#bdcbdd" stroke-width="1.5"/>
<text x="212" y="441" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#15243c" text-anchor="start">3  dist output</text>
<text x="212" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">HTML, JavaScript, CSS, assets and metadata</text>
</g>
<g data-node="hosting"><rect x="192" y="552" width="576" height="108" rx="12" fill="#fff7e6" stroke="#9a5700" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="212" y="585" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9a5700" text-anchor="start">4  AWS Amplify Hosting</text>
<text x="212" y="614" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">Owner deployment and public URL pending</text>
</g>
<g data-node="browser"><rect x="192" y="696" width="576" height="104" rx="12" fill="#f5f8fc" stroke="#bdcbdd" stroke-width="1.5"/>
<text x="212" y="729" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#15243c" text-anchor="start">5  Visitor browser</text>
<text x="212" y="758" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#485971" text-anchor="start">React routes and in-memory terminal state</text>
