<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="846" viewBox="0 0 1120 846" role="img" aria-labelledby="title desc">
<title id="title">System design and deployment boundary</title><desc id="desc">Build configuration is implemented; the AWS deployment remains pending.</desc>
<metadata id="original-mermaid-source">flowchart TB
  Author[Author and source repository] --&gt; Build[Amplify build: Node 22 and npm ci]
  Build --&gt; Verify[Unit tests and asset validation]
  Verify --&gt; Vite[Vite production build]
  Vite --&gt; Artifact[dist: entry HTML, route chunks, CSS, images, fonts, resume]
  Artifact --&gt; Check[Metadata and artifact checks]
  Check --&gt;|Deployment pending| Host[Amplify managed HTTPS hosting]
  Visitor[Visitor] --&gt;|HTTPS page or asset request| Host
  Host --&gt;|Static files and SPA entry| Browser[Browser: React application]
  Browser --&gt; Local[In-memory terminal and interface state]
  Browser -. User follows a link .-&gt; External[Separate project sites, GitHub, email and credentials]</metadata>
