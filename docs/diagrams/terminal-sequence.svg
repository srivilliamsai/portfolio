<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1176" viewBox="0 0 1040 1176" role="img" aria-labelledby="title desc">
<title id="title">Terminal interaction sequence</title><desc id="desc">A project name sets context; a follow-up reads the same local project.</desc>
<metadata id="original-mermaid-source">sequenceDiagram
  actor Visitor
  participant UI as DevTerminal
  participant Resolver as getTerminalReply
  participant Questions as resolveTerminalQuestion
  participant Data as Local project records
  Visitor-&gt;&gt;UI: glassora
  UI-&gt;&gt;Resolver: input and previous project context
  Resolver-&gt;&gt;Resolver: Resolve exact aliases or bounded spelling match
  Resolver-&gt;&gt;Questions: No command: resolve informational intent
  Questions--&gt;&gt;Resolver: Project overview: glassora
  Resolver-&gt;&gt;Data: Read description, contribution, tools and scope
  Resolver--&gt;&gt;UI: output and projectId=glassora
  UI--&gt;&gt;Visitor: Append answer; focus input
  Visitor-&gt;&gt;UI: its free
  UI-&gt;&gt;Resolver: input and projectId=glassora
  Resolver-&gt;&gt;Questions: Resolve follow-up using explicit context
  Questions--&gt;&gt;Resolver: Pricing topic for glassora
  Resolver-&gt;&gt;Data: Read dated storefront pricing record
  Resolver--&gt;&gt;UI: Answer and retained project context
  UI--&gt;&gt;Visitor: Show qualified pricing and source link</metadata>
